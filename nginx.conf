user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # HTTP to HTTPS redirect для домена
    server {
        listen 80;
        server_name ecotechstroy-dev.ru www.ecotechstroy-dev.ru;

        # Редирект на HTTPS (только для ecotechstroy-dev.ru, без www)
        if ($host = ecotechstroy-dev.ru) {
            return 301 https://ecotechstroy-dev.ru$request_uri;
        }
        
        # Редирект www на non-www HTTPS
        if ($host = www.ecotechstroy-dev.ru) {
            return 301 https://ecotechstroy-dev.ru$request_uri;
        }
        
        return 301 https://ecotechstroy-dev.ru$request_uri;
    }

    # HTTP сервер для IP-адреса (для доступа к Swagger без домена)
    server {
        listen 80;
        server_name 81.177.216.84;

        # Логи
        access_log /var/log/nginx/ip-access.log main;
        error_log /var/log/nginx/ip-error.log warn;

        # Swagger документация
        location /docs {
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API запросы (только для IP - редирект на HTTPS домен)
        location /api {
            return 301 https://ecotechstroy-dev.ru$request_uri;
        }

        # Health check
        location /health {
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Загрузки (uploads)
        location /uploads {
            alias /var/www/uploads;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Все остальные запросы возвращают 404
        location / {
            return 404;
        }
    }

    # HTTPS server (только для ecotechstroy-dev.ru)
    server {
        listen 443 ssl;
        http2 on;
        server_name ecotechstroy-dev.ru;
        
        # Редирект www на non-www
        if ($host = www.ecotechstroy-dev.ru) {
            return 301 https://ecotechstroy-dev.ru$request_uri;
        }

        # SSL сертификаты (Let's Encrypt)
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        
        # SSL настройки
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Логи
        access_log /var/log/nginx/ecotechstroy-dev.ru.access.log main;
        error_log /var/log/nginx/ecotechstroy-dev.ru.error.log warn;

        # Root для статических файлов фронтенда
        root /usr/share/nginx/html;
        index index.html;

        # API запросы проксируем на backend (только для ecotechstroy-dev.ru)
        location /api {
            # Проверяем, что запрос идет с правильного домена
            if ($host != ecotechstroy-dev.ru) {
                return 403;
            }
            
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host ecotechstroy-dev.ru;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;  # Всегда HTTPS
            proxy_set_header X-Forwarded-Host ecotechstroy-dev.ru;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
            
            # CORS headers - только для ecotechstroy-dev.ru
            add_header 'Access-Control-Allow-Origin' 'https://ecotechstroy-dev.ru' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, x-session-id' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            
            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'https://ecotechstroy-dev.ru' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, x-session-id' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
        }

        # Swagger документация
        location /docs {
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Загрузки (uploads)
        location /uploads {
            alias /var/www/uploads;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Админ панель
        location /admin {
            try_files $uri $uri/ /index.html;
        }

        # Статические файлы фронтенда
        location / {
            try_files $uri $uri/ /index.html;
            expires 1d;
            add_header Cache-Control "public, must-revalidate";
        }

        # Безопасность
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
}

