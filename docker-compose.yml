services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eco_tech_backend
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://eco-tech:eco-tech-password-db@host.docker.internal:5432/eco_tech
      - DATABASE_HOST=host.docker.internal
      - DATABASE_PORT=5432
      - DATABASE_NAME=eco_tech
      - DATABASE_USER=eco-tech
      - DATABASE_PASSWORD=eco-tech-password-db
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./backend/uploads:/app/uploads
      # Не монтируем весь backend, чтобы не перезаписать собранный dist
      # Для разработки можно раскомментировать:
      # - ./backend:/app
    ports:
      - "3000:3000"  # Временно для доступа к Swagger напрямую
    restart: unless-stopped
    networks:
      - eco-tech-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eco_tech_frontend
    volumes:
      - ./frontend:/app
    restart: unless-stopped
    networks:
      - eco-tech-network
    # Пока заглушка - будет настроено позже

  nginx:
    image: nginx:alpine
    container_name: eco_tech_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend:/usr/share/nginx/html:ro
      - ./backend/uploads:/var/www/uploads:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - eco-tech-network

  postgres-check:
    image: postgres:15-alpine
    container_name: eco_tech_postgres_check
    command: >
      sh -c "
        until pg_isready -h host.docker.internal -p 5432 -U eco-tech -d eco_tech; do
          echo 'Waiting for PostgreSQL on host...'
          sleep 2
        done
        echo 'PostgreSQL is ready!'
      "
    networks:
      - eco-tech-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PGHOST=host.docker.internal
      - PGPORT=5432
      - PGDATABASE=eco_tech
      - PGUSER=eco-tech
      - PGPASSWORD=eco-tech-password-db
    restart: "no"

networks:
  eco-tech-network:
    driver: bridge

