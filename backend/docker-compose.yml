version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eco_tech_backend
    network_mode: "host"
    env_file:
      - .env
    environment:
      - DATABASE_HOST=localhost
      - DATABASE_PORT=5432
      - DATABASE_NAME=eco_tech
      - DATABASE_USER=eco-tech
      - DATABASE_PASSWORD=eco-tech-password-db
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./uploads:/app/uploads
      - ./:/app
    restart: unless-stopped
    depends_on:
      - postgres-check
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres-check:
    image: postgres:15-alpine
    container_name: eco_tech_postgres_check
    command: >
      sh -c "
        until pg_isready -h localhost -p 5432 -U eco-tech -d eco_tech; do
          echo 'Waiting for PostgreSQL...'
          sleep 2
        done
        echo 'PostgreSQL is ready!'
      "
    network_mode: "host"
    environment:
      - PGHOST=localhost
      - PGPORT=5432
      - PGDATABASE=eco_tech
      - PGUSER=eco-tech
      - PGPASSWORD=eco-tech-password-db
    restart: "no"


